<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <rect width="300" height="450" fill="#eee9e0" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Bauhaus geometric elements -->
  <circle cx="150" cy="170" r="60" fill="#e63b2e" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="110" y="130" width="80" height="80" fill="#ffcc00" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="150" cy="170" r="24" fill="#0055ff" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Film reel slots -->
  <circle cx="130" cy="150" r="5" fill="#1a1a1a"/>
  <circle cx="170" cy="150" r="5" fill="#1a1a1a"/>
  <circle cx="130" cy="190" r="5" fill="#1a1a1a"/>
  <circle cx="170" cy="190" r="5" fill="#1a1a1a"/>

  <!-- Archival Framing -->
  <line x1="30" y1="280" x2="270" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="150" y="320" font-family="'Space Grotesk', monospace, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#1a1a1a" letter-spacing="1">ARCHIVAL RECORD</text>
  <text x="150" y="345" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#4a4a4a" letter-spacing="2">POSTER UNAVAILABLE</text>
  <rect x="90" y="370" width="120" height="24" fill="#1a1a1a"/>
  <text x="150" y="386" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="1.5">CATALOG NO. 00</text>
</svg>
